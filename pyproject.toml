[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ittop-journal-api"
version = "0.1.0"
description = "Async typed client for the confirmed IT TOP Journal API"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "ittop-journal-api contributors" }]
dependencies = ["httpx>=0.27,<1", "pydantic>=2,<3"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "respx>=0.21", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["src/ittop_journal"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".venv", ".uv-cache", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
